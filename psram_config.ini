# PSRAM Memory Optimization Configuration
# Add to platformio.ini [env:rymcu-esp32-s3-arduino3x]

build_flags = 
    ${env.build_flags}
    # Enable PSRAM optimizations
    -D BOARD_HAS_PSRAM=1
    -D CONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -D CONFIG_SPIRAM_USE_MALLOC=1
    
    # Move large buffers to PSRAM
    -D LV_MEM_CUSTOM=1
    -D LV_USE_LOG=1
    -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
    
    # Display buffer optimizations  
    -D LGFX_USE_PSRAM=1
    
    # Our parameter system optimizations
    -D PARAM_USE_PSRAM=1
